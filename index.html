<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10091b"><meta name="description" content="مطبخي — وصفات من حول العالم ومساعدك في المطبخ."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"><title>مطبخي | عالم من النكهات</title></head>
<body><header class="topbar"><button id="menuBtn" class="icon-btn mobile-only" aria-label="القائمة">☰</button><a class="brand" href="./"><span class="brand-mark">م</span><span><b>مطبخي</b><small>عالم من النكهات</small></span></a><div class="top-actions"><button id="themeBtn" class="icon-btn" aria-label="تغيير المظهر">☼</button><button id="langBtn" class="icon-btn">AR</button></div></header>
<aside class="sidebar" id="sidebar"><button class="side-link active" data-view="home">⌂ <span>الرئيسية</span></button><button class="side-link" data-view="discover">✧ <span>اكتشف المطابخ</span></button><button class="side-link" data-view="shopping">▤ <span>قائمة المشتريات</span><i id="shoppingCount"></i></button><button class="side-link" data-view="saved">♡ <span>المفضلة</span></button><button class="side-link" data-view="about">ⓘ <span>حول مطبخي</span></button><div class="sidebar-bottom"><button id="notifyBtn" class="side-small">♧ تفعيل الإشعارات</button><small>صنع بيد سيف © 2026</small></div></aside>
<main class="main-content"><section class="hero"><div class="hero-copy"><span class="eyebrow">مكوناتك اليوم، إلهام لا ينتهي</span><h1>ماذا سنطبخ <em>اليوم؟</em></h1><p>اكتشف وصفات من حول العالم، وابدأ بالمكونات الموجودة لديك.</p><div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="ابحث عن وصفة أو مكوّن..."><button id="searchBtn">بحث</button></div></div><div class="hero-art"><div class="orbit"></div><div class="orbit orbit-two"></div><div class="food-emoji" aria-hidden="true">مطبخي</div><span class="spark s1">✦</span><span class="spark s2">✧</span></div></section>
<section class="ingredient-panel"><div><h2>ماذا لديك في المطبخ؟</h2><p>اكتب المكونات المتوفرة لديك لنقترح وصفات مناسبة.</p></div><div class="ingredient-entry"><input id="ingredientInput" placeholder="مثلاً: بطاطا، بيض، طماطم"><button id="addIngredient">＋</button></div><div id="ingredientChips" class="chips"></div></section>
<section class="section-head"><div><span class="eyebrow">مختارة لك</span><h2 id="sectionTitle">وصفات تستحق التجربة</h2></div><button class="text-btn" id="clearFilters">عرض الكل ←</button></section><nav class="category-filters" aria-label="تصنيف الوصفات"><button class="category-filter active" data-category="all">كل الوصفات</button><button class="category-filter" data-category="savory">🍲 مالح</button><button class="category-filter" data-category="sweet">🍰 حلو</button><button class="category-filter" data-category="hot">🌶️ حار</button><button class="category-filter" data-category="soup">🥣 شوربات</button><button class="category-filter" data-category="bakery">🥖 مخبوزات</button><button class="category-filter" data-category="drink">🥤 مشروبات</button></nav><div class="cuisine-row"><label for="cuisineFilter">المطبخ / البلد</label><select id="cuisineFilter"><option value="all">كل المطابخ</option></select></div><div id="recipeGrid" class="recipe-grid"></div><section id="detailView" class="detail-view hidden"></section><section id="secondaryView" class="secondary-view hidden"></section></main>
<button id="installBtn" class="install-fab hidden">⇩ <span>تنزيل التطبيق</span></button><div id="toast" class="toast" role="status"></div><script src="./spicy-recipes.js" defer></script><script src="./world-recipes.js" defer></script><script src="./app.js" defer></script></body></html>
